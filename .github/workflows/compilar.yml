# Cada push compila el instalador. Un tag vX.Y.Z además crea la Release con el instalador adjunto.
name: Compilar instalador

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar
        shell: powershell
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./instalador/compilar.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador
          path: dist/Instalar-Atajo-de-Pincel.exe
          if-no-files-found: error

  publicar:
    if: github.ref_type == 'tag'
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instalador
          path: dist
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp instalador/notas-release.md notas.md
          printf '\nSHA-256 del instalador: `%s`\n' "$(sha256sum dist/Instalar-Atajo-de-Pincel.exe | cut -d' ' -f1)" >> notas.md
          gh release create "$GITHUB_REF_NAME" dist/Instalar-Atajo-de-Pincel.exe --verify-tag --title "$GITHUB_REF_NAME" --notes-file notas.md
